<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pivote Branch/Plant - Item</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="brick-container">

    <div class="filters-row">
      <div class="filter-group">
        <label>Branch/Plant</label>
        <div id="branchCheckboxes" class="checkbox-list">
          <span class="hint">Cargando...</span>
        </div>
      </div>

      <div class="filter-group">
        <label for="itemInput">Item</label>
        <input type="text" id="itemInput" placeholder="Ej: 1001A, 1002B, 1003C" />
        <span class="hint">Puedes escribir varios Items separados por coma</span>
      </div>

      <div class="filter-actions">
        <button id="btnGenerar">Generar pivote</button>
        <button id="btnLimpiar" class="secondary">Limpiar</button>
      </div>
    </div>

    <div id="statusMsg" class="status-msg"></div>
    <div id="loading" class="loading" style="display:none;">Cargando...</div>

    <div class="table-wrapper">
      <table id="pivotTable">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
