<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pivote Branch/Plant - Item</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="brick-container">

    <div class="filters-row">
      <div class="filter-group">
        <label>Branch/Plant</label>
        <div id="branchCheckboxes" class="checkbox-list">
          <span class="hint">Cargando...</span>
        </div>
      </div>

      <div class="filter-group">
        <label>Tipo de documento (opcional)</label>
        <div id="docTypeCheckboxes" class="checkbox-list">
          <span class="hint">Selecciona un Branch/Plant primero</span>
        </div>
        <span class="hint">Ninguno seleccionado = todos</span>
      </div>

      <div class="filter-group">
        <label for="itemInput">Item (opcional)</label>
        <input type="text" id="itemInput" placeholder="Ej: 1001A, 1002B, 1003C" />
        <span class="hint">Varios Items separados por coma. Vacío = toda la planta</span>
      </div>

      <div class="filter-group">
        <label for="dateFromInput">Fecha desde (opcional)</label>
        <input type="date" id="dateFromInput" />
      </div>

      <div class="filter-group">
        <label for="dateToInput">Fecha hasta (opcional)</label>
        <input type="date" id="dateToInput" />
        <span class="hint">Sin fechas = todo el rango</span>
      </div>

      <div class="filter-actions">
        <button id="btnGenerar">Generar pivote</button>
        <button id="btnLimpiar" class="secondary">Limpiar</button>
      </div>
    </div>

    <div id="statusMsg" class="status-msg"></div>
    <div id="loading" class="loading" style="display:none;">Cargando...</div>

    <div class="section-header">
      <h3>Pivote</h3>
      <button id="btnExportPivot" class="secondary small">Exportar a Excel</button>
    </div>
    <span class="hint">Da clic en una fila para ver su detalle abajo</span>
    <div class="table-wrapper">
      <table id="pivotTable">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="section-header">
      <h3 id="detailTitle">Detalle</h3>
      <button id="btnExportDetail" class="secondary small">Exportar a Excel</button>
    </div>
    <div class="table-wrapper">
      <table id="detailTable">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
