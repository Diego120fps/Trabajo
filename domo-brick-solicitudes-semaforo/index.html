<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Semáforo de Solicitudes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="brick-container">

    <div class="section-header">
      <h3>Semáforo (aging de solicitudes)</h3>
      <button id="btnRefrescar" class="secondary small">Refrescar</button>
    </div>
    <span class="hint">Solo lectura. Se refresca solo cada minuto para que el aging se mantenga al día.</span>

    <div class="filters-row">
      <div class="filter-group">
        <label for="buscarInput">Buscar (quien solicita / item)</label>
        <input type="text" id="buscarInput" placeholder="Filtrar..." />
      </div>
      <div class="filter-group checkbox-group">
        <label>
          <input type="checkbox" id="mostrarCompletadasInput" />
          Mostrar completadas
        </label>
      </div>
    </div>

    <div id="statusMsg" class="status-msg"></div>
    <div id="loading" class="loading" style="display:none;">Cargando...</div>

    <div class="table-wrapper">
      <table id="solicitudesTable">
        <thead>
          <tr>
            <th>Aging</th>
            <th>Folio</th>
            <th>Quien solicita</th>
            <th>Item</th>
            <th>Línea</th>
            <th>Cantidad</th>
            <th>Estatus</th>
            <th>User Picking</th>
            <th>User Release</th>
            <th>Tiempo</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
